<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Whole Foods Easy Order</title>
    <meta name="description" content="Your favorite products">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">🛒</span>
                <span>Whole Foods Easy Order</span>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-btn">
                    🏠 Home
                </a>
                <a href="cart.html" class="nav-btn cart-btn">
                    🛒 Cart
                    <span id="cart-count" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <h1 class="section-title">⭐ My Favorite Items</h1>

        <div id="favorites-list" class="products-grid">
            <!-- Favorites will be loaded here -->
        </div>

        <!-- Back Button -->
        <div style="text-align: center; margin-top: 48px;">
            <a href="index.html" class="btn btn-secondary btn-large">
                ← Back to Shopping
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/wholefoodsAPI.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/preferences.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
